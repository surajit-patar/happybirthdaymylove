<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Happy Birthday — A Magazine Just For You</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg1: #8e4662;
      --bg2: #eadcff;
      --ink: #2b1531;
      --rose: #e93670;
      --rose-dark: #c92759;
      --butter: #ffe29a;
      --lilac: #cdbbff;
      --mint: #bfe8d2;
      --paper: #fffdfb;
      --muted: #765879;
      --white: #fff;
      --H: 100vh;
      --sw: calc(var(--H) * .58);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: var(--H);
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.20), transparent 25%),
        linear-gradient(145deg, var(--bg1), var(--bg2));

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;

      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================
       FLOATING HEARTS
    ========================================= */

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .hearts i {
      position: absolute;
      bottom: -40px;
      color: var(--rose);
      opacity: .35;
      font-style: normal;
      animation: heartUp linear infinite;
    }

    @keyframes heartUp {
      to {
        transform:
          translateY(-115vh)
          rotate(25deg);
        opacity: 0;
      }
    }

    /* =========================================
       MAGAZINE STAGE
    ========================================= */

    .stage {
      position: relative;
      perspective: 2200px;

      width: min(calc(100vw - 28px), var(--sw));
      height: calc(var(--sw) / .72);

      touch-action: pan-y;
      z-index: 2;
    }

    .page {
      position: absolute;
      inset: 0;

      overflow: hidden;

      background: var(--paper);
      border-radius: 5px 15px 15px 5px;

      transform-origin: left center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      box-shadow:
        0 10px 30px rgba(37, 9, 42, .20);

      transition:
        transform .9s cubic-bezier(.65,0,.35,1),
        opacity .25s ease .6s;
    }

    .page.turned {
      transform: rotateY(-105deg);
      opacity: 0;
      pointer-events: none;
    }

    .page:not(.turned) {
      transition:
        transform .9s cubic-bezier(.65,0,.35,1),
        opacity 0s;
    }

    /* =========================================
       COMMON ELEMENTS
    ========================================= */

    .photo {
      position: absolute;
      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          var(--lilac),
          var(--butter)
        );

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo.missing::after {
      content: "♥";
      position: absolute;
      color: var(--rose);
      font-size: 46px;
    }

    .txt {
      position: absolute;
      left: 8%;
      right: 8%;
    }

    .num {
      position: absolute;
      right: 18px;
      bottom: 14px;

      font-size: max(10px, calc(var(--sw) * .028));
      color: var(--muted);
    }

    .eyebrow {
      display: block;

      margin-bottom: 9px;

      font-size: max(9px, calc(var(--sw) * .026));
      font-weight: 700;

      letter-spacing: .13em;
      text-transform: uppercase;

      color: var(--rose);
    }

    h2 {
      margin: 0 0 12px;

      font-family: "Bodoni Moda", serif;
      font-size: max(19px, calc(var(--sw) * .075));
      line-height: 1.05;
      font-weight: 700;
    }

    p {
      margin: 0;

      font-size: max(11.5px, calc(var(--sw) * .037));
      line-height: 1.6;
    }

    /* =========================================
       COVER
    ========================================= */

    .cover {
      color: white;
      background: var(--ink);
    }

    .cover .photo {
      inset: 0;
      opacity: .78;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(42,16,48,.82),
          rgba(42,16,48,.05) 42%,
          rgba(42,16,48,.92)
        );

      pointer-events: none;
    }

    .cover .mast {
      position: absolute;
      z-index: 2;

      top: 5%;
      left: 7%;
      right: 7%;

      text-align: center;

      font-family: "Bodoni Moda", serif;
      font-size: calc(var(--sw) * .125);
      font-weight: 700;
      line-height: .92;
      letter-spacing: .025em;
    }

    .cover .mast small {
      display: block;

      margin-top: 12px;

      font-family: "Manrope", sans-serif;
      font-size: max(9px, calc(var(--sw) * .026));
      font-weight: 700;
      letter-spacing: .13em;

      color: var(--butter);
    }

    .cover .txt {
      z-index: 2;
      bottom: 8%;
    }

    .cover .eyebrow {
      color: var(--butter);
    }

    .cover h2 {
      color: var(--butter);
      font-size: calc(var(--sw) * .095);
      font-style: italic;
    }

    /* =========================================
       PAGE STYLE 1
    ========================================= */

    .v0 .photo {
      inset: 0 0 40% 0;
    }

    .v0 .txt {
      top: 64%;
    }

    /* =========================================
       PAGE STYLE 2
    ========================================= */

    .v1 .photo {
      inset: 0;
    }

    .v1 .txt {
      bottom: 8%;
      z-index: 2;

      color: white;
      text-shadow: 0 3px 18px rgba(0,0,0,.55);
    }

    .v1::after {
      content: "";
      position: absolute;
      inset: 42% 0 0;

      background:
        linear-gradient(
          transparent,
          rgba(42,16,48,.90)
        );

      pointer-events: none;
    }

    .v1 .eyebrow {
      color: var(--butter);
    }

    .v1 .num {
      color: white;
      z-index: 3;
    }

    /* =========================================
       PAGE STYLE 3
    ========================================= */

    .v2 {
      background: #ffe49e;
    }

    .v2 .photo {
      left: 9%;
      right: 9%;
      top: 7%;
      height: 56%;

      transform: rotate(-2deg);

      border: 9px solid white;
      border-bottom-width: 28px;

      box-shadow:
        0 10px 25px rgba(42,16,48,.25);
    }

    .v2 .txt {
      top: 68%;
      text-align: center;
    }

    .v2 .eyebrow {
      color: var(--rose-dark);
    }

    /* =========================================
       FINAL PAGE
    ========================================= */

    .end {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 10%;

      text-align: center;

      color: white;
      background:
        radial-gradient(
          circle at 50% 25%,
          #f35a88,
          var(--rose)
        );
    }

    .end .photo {
      position: relative;

      width: 54%;
      aspect-ratio: 1;

      margin-bottom: 20px;

      border: 7px solid white;
      border-radius: 50%;

      box-shadow:
        0 12px 28px rgba(70,10,35,.25);
    }

    .end .eyebrow {
      color: var(--butter);
    }

    .end h2 {
      font-size: calc(var(--sw) * .105);
      font-style: italic;
    }

    /* =========================================
       NAVIGATION
    ========================================= */

    .bar {
      position: relative;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;

      padding: 10px 20px;

      background: var(--rose);
      color: white;

      font: inherit;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 5px 14px rgba(65,12,40,.15);

      transition:
        transform .2s,
        opacity .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .35;
      cursor: default;
      transform: none;
    }

    button:focus-visible {
      outline: 3px solid var(--butter);
      outline-offset: 3px;
    }

    .cnt {
      min-width: 65px;

      text-align: center;

      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .ghost {
      position: fixed;

      top: calc(9px + env(safe-area-inset-top, 0px));
      right: 10px;

      z-index: 10;

      padding: 7px 14px;

      color: var(--muted);
      background: rgba(255,255,255,.22);

      border: 1.5px solid var(--muted);

      font-size: 12px;
      box-shadow: none;
    }

    /* =========================================
       BALLOONS
    ========================================= */

    .balloon-layer {
      position: fixed;
      inset: 0;

      overflow: hidden;
      pointer-events: none;

      z-index: 7;
    }

    .balloon {
      position: absolute;

      bottom: -180px;

      width: 65px;
      height: 82px;

      animation:
        balloonUp var(--duration) linear forwards;

      filter:
        drop-shadow(0 8px 8px rgba(35,10,40,.20));
    }

    .balloon-body {
      position: absolute;

      width: 58px;
      height: 70px;

      left: 3px;
      top: 0;

      border-radius:
        50% 50% 45% 45%;

      background:
        radial-gradient(
          circle at 32% 24%,
          rgba(255,255,255,.55),
          transparent 17%
        ),
        var(--balloon-color);

      transform: rotate(var(--tilt));
    }

    .balloon-body::after {
      content: "";

      position: absolute;

      left: 24px;
      bottom: -6px;

      width: 0;
      height: 0;

      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 9px solid var(--balloon-color);
    }

    .balloon-string {
      position: absolute;

      left: 32px;
      top: 69px;

      width: 1px;
      height: 115px;

      background: rgba(55,20,55,.45);

      transform: rotate(2deg);
      transform-origin: top;
    }

    .fruit-tag {
      position: absolute;

      top: 77px;
      left: 50%;

      transform: translateX(-50%);

      min-width: 135px;
      max-width: 170px;

      padding: 8px 12px;

      border-radius: 13px;

      color: #42203d;
      background: #fffdf8;

      border: 2px solid var(--tag-color);

      box-shadow:
        0 5px 16px rgba(45,10,45,.18);

      text-align: center;

      font-size: 11px;
      line-height: 1.25;
      font-weight: 700;

      opacity: 0;

      animation:
        tagPop var(--duration) ease forwards;
    }

    .fruit {
      display: block;
      font-size: 20px;
      line-height: 1;
      margin-bottom: 3px;
    }

    @keyframes balloonUp {
      0% {
        transform:
          translate3d(0, 0, 0)
          rotate(0);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      50% {
        transform:
          translate3d(var(--drift), -58vh, 0)
          rotate(5deg);
      }

      100% {
        transform:
          translate3d(
            calc(var(--drift) * -1),
            -125vh,
            0
          )
          rotate(-7deg);

        opacity: 0;
      }
    }

    @keyframes tagPop {
      0%,
      8% {
        opacity: 0;
        transform:
          translateX(-50%)
          scale(.7);
      }

      15%,
      75% {
        opacity: 1;
        transform:
          translateX(-50%)
          scale(1);
      }

      90%,
      100% {
        opacity: 0;
        transform:
          translateX(-50%)
          scale(.8);
      }
    }

    /* =========================================
       INTRO
    ========================================= */

    #intro {
      position: fixed;
      inset: 0;

      z-index: 50;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 19px;

      padding: 20px;

      color: white;
      text-align: center;

      background:
        radial-gradient(
          circle at 50% 38%,
          #652477,
          #1b0925
        );

      transition:
        opacity 1s ease,
        visibility 1s;
    }

    #intro.gone {
      opacity: 0;
      visibility: hidden;
    }

    .intro-heart {
      width: 92px;

      filter:
        drop-shadow(
          0 0 24px rgba(232,54,109,.85)
        );

      animation:
        beat 1.2s ease-in-out infinite;
    }

    @keyframes beat {
      0%,100% {
        transform: scale(1);
      }

      20% {
        transform: scale(1.18);
      }

      40% {
        transform: scale(1);
      }
    }

    #intro h1 {
      margin: 0;

      font-family: "Bodoni Moda", serif;
      font-size: clamp(25px, 6vw, 40px);
      font-weight: 500;
      font-style: italic;
    }

    #intro .sub {
      min-height: 20px;

      font-size: 14px;
      opacity: .8;
    }

    .progress {
      width: min(250px, 72vw);
      height: 6px;

      overflow: hidden;

      border-radius: 99px;

      background: rgba(255,255,255,.18);
    }

    .progress-fill {
      width: 0;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--butter),
          var(--rose)
        );

      animation:
        loading 3.4s
        cubic-bezier(.5,.1,.3,1)
        forwards;
    }

    @keyframes loading {
      to {
        width: 100%;
      }
    }

    #open {
      opacity: 0;
      visibility: hidden;

      transform: translateY(8px);

      transition:
        opacity .8s,
        transform .8s,
        visibility .8s;
    }

    #open.show {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .spark {
      position: absolute;
      color: var(--butter);

      opacity: 0;

      animation:
        sparkle 2.4s ease-in-out infinite;
    }

    @keyframes sparkle {
      50% {
        opacity: 1;
        transform:
          scale(1.4)
          rotate(20deg);
      }
    }

    .stage.enter {
      animation:
        stageEnter 1.3s
        cubic-bezier(.2,.8,.2,1)
        both;
    }

    @keyframes stageEnter {
      from {
        opacity: 0;
        transform:
          scale(.88)
          translateY(30px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 759px) {
      :root {
        --sw: calc((var(--H) - 215px) * .72);
      }

      body {
        padding-top: 46px;
        padding-bottom: 104px;
        gap: 8px;
      }

      .stage {
        width: var(--sw);
        height: calc(var(--sw) / .72);
      }

      .balloon {
        transform-origin: center;
        width: 55px;
        height: 72px;
      }

      .balloon-body {
        width: 50px;
        height: 63px;
      }

      .balloon-string {
        left: 27px;
      }

      .fruit-tag {
        min-width: 120px;
        max-width: 145px;
        font-size: 10px;
      }
    }

    @media (max-width: 759px) and (max-height: 520px) {
      :root {
        --sw: calc((var(--H) - 100px) * .72);
      }

      body {
        padding-top: 40px;
        padding-bottom: 0;
      }

      .balloon-layer {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hearts {
        display: none;
      }

      .page {
        transition-duration: .01s;
      }

      .balloon {
        animation-duration: .01s;
      }

      .fruit-tag {
        animation-duration: .01s;
      }

      .intro-heart {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       INTRO
  ========================================= -->

  <div id="intro">

    <span class="spark" style="top:18%;left:20%">✦</span>
    <span class="spark" style="top:30%;right:18%;animation-delay:.7s">✦</span>
    <span class="spark" style="bottom:24%;left:28%;animation-delay:1.3s">✦</span>
    <span class="spark" style="bottom:18%;right:26%;animation-delay:.3s">✦</span>

    <svg
      class="intro-heart"
      viewBox="0 0 32 29"
      aria-hidden="true"
    >
      <path
        d="M16 28C16 28 1 18 1 9C1 4 5 1 9 1C12 1 15 3 16 6C17 3 20 1 23 1C27 1 31 4 31 9C31 18 16 28 16 28Z"
        fill="#e8366d"
      />
    </svg>

    <h1>A little surprise is waiting…</h1>

    <div class="progress">
      <div class="progress-fill"></div>
    </div>

    <div class="sub" id="introText">
      Wrapping your birthday gift
    </div>

    <button id="open">
      Open Your Magazine
    </button>

  </div>


  <!-- =========================================
       BACKGROUND HEARTS
  ========================================= -->

  <div class="hearts" id="hearts"></div>


  <!-- =========================================
       BALLOONS
  ========================================= -->

  <div
    class="balloon-layer"
    id="balloons"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       MAGAZINE
  ========================================= -->

  <main
    class="stage"
    id="stage"
    aria-live="polite"
  ></main>


  <!-- =========================================
       NAVIGATION
  ========================================= -->

  <div class="bar">

    <button
      id="prev"
      aria-label="Previous page"
    >
      ← Back
    </button>

    <span
      class="cnt"
      id="cnt"
    >
      1 / 24
    </span>

    <button
      id="next"
      aria-label="Next page"
    >
      Next →
    </button>

  </div>


  <!-- =========================================
       MUSIC
  ========================================= -->

  <button
    class="ghost"
    id="mute"
    aria-label="Toggle birthday music"
  >
    ♫ Music on
  </button>


  <script>

    /* =========================================

    /* =========================================
       HELPERS
    ========================================= */

    const $ = id =>
      document.getElementById(id);

    const stage = $("stage");

    const fill = text =>
      text.replace(/\{n\}/g, name);


    /* =========================================
       PHOTO HTML
    ========================================= */

    function photo(i) {

      return `
        <div class="photo">
          <img
            src="${PHOTO_FILES[i]}"
            alt="Birthday memory ${i + 1}"
            loading="eager"
            onerror="this.parentElement.classList.add('missing')"
          >
        </div>
      `;
    }


    /* =========================================
       BUILD MAGAZINE
    ========================================= */

    let cur = 0;

    function build() {

      stage.innerHTML = "";

      T.forEach((t, i) => {

        const page =
          document.createElement("section");

        page.style.zIndex = N - i;

        /*
          COVER
        */

        if (i === 0) {

          page.className =
            "page cover";

          page.innerHTML = `

            ${photo(i)}


            <div class="txt">

              <span class="eyebrow">
                A magazine made with love
              </span>

              <h2>
                ${fill(t[0])}
              </h2>

              <p>
                ${fill(t[1])}
              </p>

            </div>

          `;
        }

        /*
          FINAL PAGE
        */

        else if (i === N - 1) {

          page.className =
            "page end";

          page.innerHTML = `

            ${photo(i)}

            <span class="eyebrow">
              The final page
            </span>

            <h2>
              ${fill(t[0])}
            </h2>

            <p>
              ${fill(t[1])}
            </p>

          `;
        }

        /*
          NORMAL PAGES
        */

        else {

          page.className =
            "page v" + (i % 3);

          page.innerHTML = `

            ${photo(i)}

            <div class="txt">

              <span class="eyebrow">
                Birthday memories · ${String(i).padStart(2, "0")}
              </span>

              <h2>
                ${fill(t[0])}
              </h2>

              <p>
                ${fill(t[1])}
              </p>

            </div>

            <span class="num">
              ${i + 1}
            </span>

          `;
        }

        stage.appendChild(page);

      });

      show();
    }


    /* =========================================
       SHOW CURRENT PAGE
    ========================================= */

    function show() {

      [...stage.children].forEach((page, i) => {

        page.classList.toggle(
          "turned",
          i < cur
        );

      });

      $("cnt").textContent =
        `${cur + 1} / ${N}`;

      $("prev").disabled =
        cur === 0;

      $("next").disabled =
        cur === N - 1;
    }


    /* =========================================
       NAVIGATION
    ========================================= */

    function go(direction) {

      const next =
        Math.min(
          N - 1,
          Math.max(
            0,
            cur + direction
          )
        );

      if (next !== cur) {

        cur = next;
        show();

      }
    }

    $("next").onclick =
      () => go(1);

    $("prev").onclick =
      () => go(-1);


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowRight" ||
          event.key === " "
        ) {
          event.preventDefault();
          go(1);
        }

        if (
          event.key === "ArrowLeft"
        ) {
          event.preventDefault();
          go(-1);
        }

      }
    );


    /* =========================================
       SWIPE / TAP
    ========================================= */

    let sx = null;

    stage.addEventListener(
      "pointerdown",
      event => {
        sx = event.clientX;
      }
    );

    stage.addEventListener(
      "pointercancel",
      () => {
        sx = null;
      }
    );

    stage.addEventListener(
      "pointerup",
      event => {

        if (sx === null)
          return;

        const dx =
          event.clientX - sx;

        sx = null;

        if (Math.abs(dx) > 45) {

          go(dx < 0 ? 1 : -1);
          return;

        }

        const rect =
          stage.getBoundingClientRect();

        go(
          event.clientX - rect.left >
          rect.width * .35
            ? 1
            : -1
        );

      }
    );


    /* =========================================
       HEARTS
    ========================================= */

    const hearts = $("hearts");

    for (let i = 0; i < 16; i++) {

      const h =
        document.createElement("i");

      h.textContent = "♥";

      h.style.left =
        Math.random() * 100 + "%";

      h.style.fontSize =
        12 + Math.random() * 22 + "px";

      h.style.animationDuration =
        9 + Math.random() * 10 + "s";

      h.style.animationDelay =
        -Math.random() * 14 + "s";

      hearts.appendChild(h);
    }


    /* =========================================
       BALLOON MESSAGES
    ========================================= */

    const BALLOON_MESSAGES = [

      ["🍓", "Sweetest person ever!"],
      ["🍒", "You make life sweeter."],
      ["🍊", "Sending you sunshine!"],
      ["🍋", "Keep shining, birthday girl!"],
      ["🍎", "You are loved so much."],
      ["🍉", "Today is all about YOU!"],
      ["🍇", "Cheers to another beautiful year!"],
      ["🥝", "Stay happy, stay amazing!"],
      ["🍑", "You are simply adorable."],
      ["🍍", "Big birthday hugs!"],
      ["🥭", "More smiles, more memories!"],
      ["🍓", "Make a beautiful wish!"],
      ["🍒", "You deserve every happiness."],
      ["🍊", "Keep smiling, sunshine!"],
      ["🍉", "Happy Birthday, beautiful!"],
      ["🍎", "You make ordinary days special."]
    ];

    const BALLOON_COLORS = [
      "#ef4778",
      "#ff9f68",
      "#ffc857",
      "#8ed6c0",
      "#b79cff",
      "#78bde8",
      "#f07fb1"
    ];

    const balloons =
      $("balloons");

    let balloonIndex = 0;

    function spawnBalloon() {

      if (document.hidden)
        return;

      const balloon =
        document.createElement("div");

      balloon.className =
        "balloon";

      const left =
        5 + Math.random() * 90;

      const duration =
        8 + Math.random() * 5;

      const drift =
        -70 + Math.random() * 140;

      const color =
        BALLOON_COLORS[
          Math.floor(
            Math.random() *
            BALLOON_COLORS.length
          )
        ];

      const message =
        BALLOON_MESSAGES[
          balloonIndex++ %
          BALLOON_MESSAGES.length
        ];

      balloon.style.left =
        left + "%";

      balloon.style.setProperty(
        "--duration",
        duration + "s"
      );

      balloon.style.setProperty(
        "--drift",
        drift + "px"
      );

      balloon.style.setProperty(
        "--balloon-color",
        color
      );

      balloon.style.setProperty(
        "--tilt",
        (-8 + Math.random() * 16) + "deg"
      );

      balloon.style.setProperty(
        "--tag-color",
        color
      );

      balloon.innerHTML = `

        <div class="balloon-body"></div>

        <div class="balloon-string"></div>

        <div class="fruit-tag">

          <span class="fruit">
            ${message[0]}
          </span>

          ${message[1]}

        </div>

      `;

      balloons.appendChild(balloon);

      setTimeout(
        () => balloon.remove(),
        (duration + 1) * 1000
      );
    }


    /* =========================================
       MUSIC
    ========================================= */

    let ac = null;
    let musicOn = false;
    let loopT = null;

    const NOTES = [

      [392, .75],
      [392, .25],
      [440, 1],
      [392, 1],
      [523, 1],
      [494, 2],

      [392, .75],
      [392, .25],
      [440, 1],
      [392, 1],
      [587, 1],
      [523, 2],

      [392, .75],
      [392, .25],
      [784, 1],
      [659, 1],
      [523, 1],
      [494, 1],
      [440, 2],

      [698, .75],
      [698, .25],
      [659, 1],
      [523, 1],
      [587, 1],
      [523, 2]
    ];


    function tune() {

      const beat = .62;

      let t =
        ac.currentTime + .1;

      const out =
        ac.createGain();

      out.gain.value = .45;

      out.connect(
        ac.destination
      );

      NOTES.forEach(
        ([frequency, duration]) => {

          [
            [frequency, "triangle", .18],
            [frequency * 2, "sine", .045]
          ].forEach(
            ([fr, type, volume]) => {

              const oscillator =
                ac.createOscillator();

              const gain =
                ac.createGain();

              oscillator.type = type;
              oscillator.frequency.value = fr;

              gain.gain.setValueAtTime(
                0,
                t
              );

              gain.gain.linearRampToValueAtTime(
                volume,
                t + .015
              );

              gain.gain.exponentialRampToValueAtTime(
                .0008,
                t +
                duration *
                beat *
                1.5
              );

              oscillator.connect(gain);
              gain.connect(out);

              oscillator.start(t);

              oscillator.stop(
                t +
                duration *
                beat *
                1.6
              );

            }
          );

          t += duration * beat;
        }
      );

      return t - ac.currentTime;
    }


    function loopTune() {

      if (!musicOn || !ac)
        return;

      const duration =
        tune();

      loopT =
        setTimeout(
          loopTune,
          (duration + 2) * 1000
        );
    }


    function startMusic() {

      if (musicOn)
        return;

      musicOn = true;

      $("mute").textContent =
        "♫ Music on";

      try {

        ac =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        ac.resume();

        loopTune();

      } catch (error) {

        console.log(
          "Music unavailable",
          error
        );

      }
    }


    function stopMusic() {

      musicOn = false;

      $("mute").textContent =
        "♫ Music off";

      clearTimeout(loopT);

      if (ac) {

        ac.close();
        ac = null;

      }
    }


    $("mute").onclick =
      () => {

        if (musicOn)
          stopMusic();
        else
          startMusic();

      };


    /* =========================================
       INTRO SEQUENCE
    ========================================= */

    const introText =
      $("introText");

    setTimeout(
      () => {
        introText.textContent =
          "Adding your sweetest memories";
      },
      1400
    );

    setTimeout(
      () => {
        introText.textContent =
          "Adding a little sparkle";
      },
      2600
    );

    setTimeout(
      () => {

        introText.textContent =
          "Made with love, just for you";

        $("open")
          .classList
          .add("show");

      },
      3500
    );


    $("open").onclick =
      () => {

        startMusic();

        $("intro")
          .classList
          .add("gone");

        stage
          .classList
          .add("enter");

        /*
          Start balloons after
          the magazine opens.
        */

        setTimeout(
          spawnBalloon,
          1800
        );

        setTimeout(
          spawnBalloon,
          3500
        );

        setInterval(
          spawnBalloon,
          5200
        );

        setTimeout(
          () => {
            $("intro").remove();
          },
          1200
        );

      };


    /* =========================================
       RESPONSIVE HEIGHT
    ========================================= */

    function setHeight() {

      document.documentElement
        .style
        .setProperty(
          "--H",
          innerHeight + "px"
        );

    }

    setHeight();

    window.addEventListener(
      "resize",
      setHeight
    );

    window.addEventListener(
      "orientationchange",
      () => {
        setTimeout(
          setHeight,
          250
        );
      }
    );


    /* =========================================
       START
    ========================================= */

    stage.style.opacity = 0;

    $("open").addEventListener(
      "click",
      () => {
        stage.style.opacity = "";
      },
      { once: true }
    );

    build();

  </script>

</body>
</html>
